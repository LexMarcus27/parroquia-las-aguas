<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Horarios de celebraciones, confesiones, Hora Santa y atención del despacho parroquial.">
    <title>Horarios | Parroquia Nuestra Señora de Las Aguas</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body data-page="horarios">
    <div id="site-header"></div>
    <main id="main-content">
      <header class="inner-hero">
        <div class="container">
          <span class="eyebrow">Celebración y encuentro</span>
          <h1>Horarios de la parroquia</h1>
          <p>Horarios de las celebraciones, la oración y la atención del despacho parroquial.</p>
        </div>
      </header>
      <section class="content-section" aria-label="Horarios detallados">
        <div class="container content-grid">
          <article class="info-card accent">
            <h2>Horarios de misas</h2>
            <div data-schedule="massesSchedulePage"></div>
            <p class="notice">Por confirmar: la portada original también incluía una misa a las 12:30 p. m. de martes a viernes.</p>
          </article>
          <article class="info-card">
            <h2>Confesiones</h2>
            <div data-schedule="confessionsSchedulePage"></div>
          </article>
          <article class="info-card">
            <h2>Hora Santa</h2>
            <p data-schedule="holyHour"></p>
          </article>
          <article class="info-card">
            <h2>Despacho parroquial</h2>
            <div data-schedule="office"></div>
          </article>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
